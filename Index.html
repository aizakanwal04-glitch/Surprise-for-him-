# Surprise-for-him-<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make His Surprise</title>
    <style>
        :root {
            --bg-color: #fce4ec;
            --card-bg: #ffffff;
            --primary-accent: #9c27b0;
            --burgundy: #801D38;
            --pink-soft: #FFF0F2;
            --text-dark: #333333;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* Simulating a mobile phone wrapper */
        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 844px;
            background-color: var(--pink-soft);
            position: relative;
            overflow: hidden;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 8px solid #222;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 24px;
            overflow-y: auto;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* STEP 1: SETUP FORM STYLES */
        .form-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            border: 4px solid var(--burgundy);
            margin-top: 20px;
            box-shadow: 0 8px 16px rgba(128, 29, 56, 0.1);
        }

        h2.title {
            color: var(--burgundy);
            font-size: 26px;
            text-align: center;
            margin-bottom: 6px;
            font-family: 'Georgia', serif;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background-color: #fafafa;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--burgundy);
            background-color: #fff;
        }

        .photo-slots-label {
            font-size: 11px;
            font-weight: bold;
            color: var(--burgundy);
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .photo-uploader {
            border: 1px dashed var(--burgundy);
            background: var(--pink-soft);
            border-radius: 12px;
            height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .photo-uploader span {
            font-size: 11px;
            color: var(--burgundy);
            text-align: center;
        }

        .photo-uploader img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .photo-uploader input[type="file"] {
            display: none;
        }

        .btn-primary {
            background-color: var(--burgundy);
            color: white;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(128, 29, 56, 0.3);
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* STEP 2: LOCKSCREEN STYLES */
        #screen-lockscreen {
            background: linear-gradient(to bottom, #ff94b1, #9c254d);
            padding: 40px 20px;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }
        #screen-lockscreen.active { display: flex; }

        .lockscreen-time-box {
            text-align: center;
            color: white;
            margin-top: 40px;
        }

        .lockscreen-time {
            font-size: 64px;
            font-weight: 300;
        }

        .lockscreen-date {
            font-size: 18px;
            margin-top: -5px;
            opacity: 0.9;
        }

        .notification-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 60px;
        }

        .ios-notification {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        .ios-notification.glowing {
            animation: pulseGlow 2s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 4px 14px rgba(255,255,255,0.2); }
            50% { box-shadow: 0 4px 25px rgba(255, 182, 193, 0.8); transform: scale(1.02); }
            100% { box-shadow: 0 4px 14px rgba(255,255,255,0.2); }
        }

        .notif-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .notif-title {
            font-size: 14px;
            font-weight: 700;
            color: #000;
        }

        .notif-body {
            font-size: 13px;
            color: #222;
            margin-top: 2px;
        }

        .tap-hint {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            font-style: italic;
            margin-top: 10px;
        }

        /* STEP 3: BOUQUET ENVELOPE STYLES */
        .envelope-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .envelope-title {
            font-size: 26px;
            font-family: 'Georgia', serif;
            color: var(--burgundy);
            margin-bottom: 30px;
        }

        .bouquet-card {
            background: white;
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 280px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .bouquet-card:hover {
            transform: scale(1.03);
        }

        .bouquet-img {
            width: 100%;
            border-radius: 14px;
            display: block;
        }

        .action-hint {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            font-style: italic;
        }

        /* STEP 4: POLAROID REVEAL STYLES */
        .polaroid-screen-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .welcome-text {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 24px;
            color: var(--burgundy);
            margin-bottom: 4px;
        }

        .welcome-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .polaroid-frame {
            background: white;
            padding: 16px 16px 40px 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-radius: 4px;
            width: 280px;
            transform: rotate(-2deg);
            margin-bottom: 4px;
        }

        .polaroid-slideshow {
            width: 100%;
            height: 250px;
            background: #eee;
            position: relative;
            overflow: hidden;
        }

        .polaroid-slideshow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .polaroid-slideshow img.visible {
            opacity: 1;
        }

        .polaroid-caption {
            text-align: center;
            margin-top: 25px;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 14px;
            color: var(--burgundy);
            line-height: 1.4;
        }

        /* STEP 5: FINAL LETTER SCREEN STYLES */
